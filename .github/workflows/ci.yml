name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tags are covered by release.yml, which runs the same checks before it
# builds anything.

permissions:
  contents: read

jobs:
  check:
    name: Import, test and run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      - name: Import, test, headless run
        run: .github/scripts/check.sh
