name: CI

# Only on version tags (alongside release.yml, which only builds and
# publishes): pushes to main and pull requests run nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Import, test and run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      - name: Import, test, headless run
        run: .github/scripts/check.sh
