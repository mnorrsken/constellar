name: Release
run-name: Release ${{ github.ref_name }}

# Tag a commit and the installers appear on a GitHub release:
#
#     make test && git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match config/version in project.godot: the workflow refuses to
# build otherwise, so a release can't ship with a stale version in the macOS
# bundle, the MSI and the file names. (Laid out like fringeworlds' release.)
#
# workflow_dispatch runs everything except publishing, which is how you check a
# change to this file without burning a version number.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read config/version (and check the tag matches it)
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match config/version=\"$version\" in project.godot"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - uses: ./.github/actions/setup-godot

      - name: Import, test, headless run
        run: .github/scripts/check.sh

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows cross-exports fine from Linux.
          - { os: ubuntu-latest, target: windows }
          # macOS is built on a Mac so the ad-hoc signature is made by the real
          # codesign and can be verified here: an unsigned arm64 app will not
          # launch at all on Apple silicon.
          - { os: macos-latest, target: mac }
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      # First import of a fresh checkout logs font errors (see check.sh).
      - name: Warm up the import cache
        run: make import GODOT="$GODOT_BIN" > /dev/null 2>&1 || true

      - name: Export ${{ matrix.target }}
        run: |
          set -euo pipefail
          make export-${{ matrix.target }} GODOT="$GODOT_BIN" 2>&1 | tee export.log
          if grep -E "ERROR|SCRIPT" export.log; then exit 1; fi

      - name: Build and check the disk image
        if: matrix.target == 'mac'
        run: |
          set -euo pipefail
          packaging/macos/build-dmg.sh build/macos/Constellar.zip "$VERSION" dist
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/constellar dist/*.dmg
          app=/tmp/constellar/Constellar.app
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Signature=adhoc"
          exe=$(defaults read "$app/Contents/Info" CFBundleExecutable)
          "$app/Contents/MacOS/$exe" --headless --quit-after 40
          hdiutil detach /tmp/constellar
          echo "Disk image built; the app is signed and starts cleanly."

      - name: Upload the Windows game
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: build/windows/Constellar.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload the disk image
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: installer-mac
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # WiX only runs on Windows. This job only packages and installs: the game
  # itself is not started here (a headless run on the Windows runner hung).
  msi:
    name: Windows installer
    needs: [test, build]
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-windows
          path: build/windows

      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version $env:VERSION -ExePath build/windows/Constellar.exe -OutDir dist

      - name: Install and uninstall
        shell: pwsh
        run: |
          function Invoke-Msiexec($arguments) {
            $p = Start-Process msiexec -PassThru -NoNewWindow -ArgumentList $arguments
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "msiexec $($arguments[0]) timed out" }
            return $p.ExitCode
          }
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $code = Invoke-Msiexec @('/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', 'install.log')
          if ($code -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $code" }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Constellar\Constellar.exe'
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 60; throw "nothing landed at $exe" }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Constellar.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }
          if (Test-Path (Join-Path $env:ProgramFiles 'Constellar')) { throw "a per-user install wrote to Program Files" }

          $code = Invoke-Msiexec @('/x', "`"$msi`"", '/quiet', '/norestart')
          if ($code -ne 0) { throw "uninstall failed: $code" }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          Write-Host "Installed and uninstalled cleanly."

      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [test, build, msi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum constellar_* > checksums.txt
          ls -lh
          cat checksums.txt

      - name: Extract the changelog section for this release
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "::error::no CHANGELOG section for $VERSION"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            cat <<'NOTES'
          ## Install

          **The first launch shows a security warning on Windows and macOS.**
          These builds aren't signed with a paid developer certificate, so the
          OS can't identify the publisher. Nothing is wrong with the game.

          - **Windows:** run the `.msi`. It installs for your user only (no
            administrator rights) into `%LocalAppData%\Programs\Constellar` and
            adds Constellar to the Start menu. SmartScreen shows "Windows
            protected your PC": click **More info**, then **Run anyway**.
          - **macOS** (Intel: 11 or later; Apple silicon: 13 or later): open the
            `.dmg` and drag Constellar onto Applications. The first start is
            blocked: open **System Settings > Privacy & Security** and choose
            **Open Anyway**, or clear the download flag with
            `xattr -dr com.apple.quarantine /Applications/Constellar.app`.

          Check a download with `sha256sum -c checksums.txt` (attached below).

          NOTES
            cat notes-body.md
          } > notes.md

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Constellar $GITHUB_REF_NAME" \
            --notes-file notes.md
