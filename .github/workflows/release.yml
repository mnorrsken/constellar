name: Release
run-name: Release ${{ github.ref_name }}

# A v* tag builds the Windows and macOS installers and publishes a GitHub
# release with them. Run it by hand (Actions > Release > Run workflow) for a
# dry run: everything is built and smoke-tested as version 0.0.0 and kept as
# workflow artifacts, but nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with ci.yml and the Godot the project is made with.
  GODOT_VERSION: "4.7.2"

jobs:
  check:
    name: Import, test and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot
        run: .github/scripts/install-godot.sh

      - name: Import, test, headless run
        run: .github/scripts/check.sh

  export:
    name: Export the game
    runs-on: ubuntu-latest
    needs: [check]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the export templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot and the export templates
        run: .github/scripts/install-godot.sh --templates

      # The exports read their version (Windows file version, macOS bundle
      # version) from the project setting.
      - name: Stamp the version
        run: |
          sed -i 's/^config\/version=.*/config\/version="${{ steps.version.outputs.version }}"/' project.godot
          grep '^config/version=' project.godot

      # First import of a fresh checkout logs font errors (see check.sh).
      - name: Warm up the import cache
        run: make import > /dev/null 2>&1 || true

      - name: Export
        run: |
          make export-windows 2>&1 | tee export.log
          make export-mac 2>&1 | tee -a export.log
          if grep -E "ERROR|SCRIPT" export.log; then exit 1; fi
          ls -la build/windows build/macos
          test -s build/windows/Constellar.exe
          test -s build/macos/Constellar.zip

      - name: Upload the exports
        uses: actions/upload-artifact@v7
        with:
          name: exports
          path: |
            build/windows/Constellar.exe
            build/macos/Constellar.zip
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [export]
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the exports
        uses: actions/download-artifact@v8
        with:
          name: exports
          path: build

      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version ${{ needs.export.outputs.version }} -ExePath build/windows/Constellar.exe -OutDir dist

      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Constellar\Constellar.exe'
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 60; throw "nothing landed at $exe" }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Constellar.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }
          if (Test-Path (Join-Path $env:ProgramFiles 'Constellar')) { throw "a per-user install wrote to Program Files" }

          $run = Start-Process $exe -PassThru -Wait -ArgumentList @('--headless', '--quit-after', '20')
          if ($run.ExitCode -ne 0) { throw "the game exited with $($run.ExitCode)" }

          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/x', "`"$msi`"", '/quiet', '/norestart')
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    needs: [export]
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the exports
        uses: actions/download-artifact@v8
        with:
          name: exports
          path: build

      - name: Build the disk image
        run: packaging/macos/build-dmg.sh build/macos/Constellar.zip ${{ needs.export.outputs.version }} dist

      - name: Mount and run
        run: |
          dmg=$(ls dist/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/constellar "$dmg"
          app=/tmp/constellar/Constellar.app
          codesign --verify --deep --strict "$app"
          exe=$(defaults read "$app/Contents/Info" CFBundleExecutable)
          "$app/Contents/MacOS/$exe" --headless --quit-after 20
          hdiutil detach /tmp/constellar

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [export, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Compute sha256 checksums
        working-directory: dist
        run: |
          sha256sum constellar_* > checksums.txt
          cat checksums.txt

      - name: Extract the changelog section for this release
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "No CHANGELOG section for ${VERSION_NO_V}" >&2
            exit 1
          fi
          cat notes-body.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            cat notes-body.md
            cat <<'NOTES'

          ## Install

          **Windows:** run the `.msi`. It installs for your user only (no
          administrator rights) into `%LocalAppData%\Programs\Constellar` and
          adds Constellar to the Start menu. The installer is not signed, so
          SmartScreen may say "Windows protected your PC": choose **More info**,
          then **Run anyway**.

          **macOS** (Intel: macOS 11 or later; Apple silicon: 13 or later): open
          the `.dmg` and drag Constellar onto Applications. The app is not notarized, so the
          first start is blocked: open **System Settings > Privacy & Security**
          and choose **Open Anyway** (or run
          `xattr -dr com.apple.quarantine /Applications/Constellar.app`).

          Check a download with `sha256sum -c checksums.txt` (attached below).
          NOTES
          } > notes.md

          gh release create "$VERSION" \
            --title "Constellar $VERSION" \
            --notes-file notes.md \
            dist/constellar_* dist/checksums.txt
